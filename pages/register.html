<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>S'inscrire — PHG AKHENATON IA</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; padding-top: 5rem; }
.auth-card { background: #111; border: 1px solid rgba(212,168,50,0.3); border-radius: 16px; padding: 3rem; width: 100%; max-width: 500px; }
.auth-logo { text-align: center; margin-bottom: 2rem; }
.auth-logo .logo-eye { font-size: 2.5rem; color: #d4a832; }
.auth-card h2 { font-family: 'Cinzel', serif; text-align: center; color: #d4a832; margin-bottom: 0.5rem; }
.auth-card p { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
.form-group { margin-bottom: 1.25rem; }
.form-group label { display: block; font-size: 0.85rem; color: #ccc; margin-bottom: 0.4rem; }
.form-group input, .form-group select { width: 100%; background: #1a1a1a; border: 1px solid rgba(212,168,50,0.2); border-radius: 8px; padding: 0.75rem 1rem; color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
.form-group input:focus, .form-group select:focus { border-color: #d4a832; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
.role-select { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; margin-bottom: 1.5rem; }
.role-btn { background: #1a1a1a; border: 1px solid rgba(212,168,50,0.2); border-radius: 8px; padding: 1rem; text-align: center; cursor: pointer; transition: all 0.3s; color: #ccc; }
.role-btn:hover, .role-btn.active { border-color: #d4a832; background: rgba(212,168,50,0.08); color: #d4a832; }
.role-btn .role-icon { font-size: 1.5rem; display: block; margin-bottom: 0.3rem; }
.role-btn .role-label { font-size: 0.85rem; font-weight: 500; }
.btn-submit { width: 100%; background: #d4a832; color: #0a0a0a; border: none; border-radius: 8px; padding: 0.9rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: background 0.3s; }
.btn-submit:hover { background: #f0c84a; }
.auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #888; }
.auth-footer a { color: #d4a832; text-decoration: none; }
.error-msg { background: rgba(139,26,26,0.2); border: 1px solid rgba(139,26,26,0.4); border-radius: 8px; padding: 0.75rem; color: #ff6b6b; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
.success-msg { background: rgba(26,58,26,0.3); border: 1px solid rgba(26,139,26,0.4); border-radius: 8px; padding: 0.75rem; color: #6bff6b; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-eye">𓂀</div>
    </div>
    <h2>Rejoindre l'Empire</h2>
    <p>Créez votre compte PHG AKHENATON IA</p>

    <p style="color:#d4a832; font-size:0.85rem; text-align:center; margin-bottom:1rem;">Je suis :</p>
    <div class="role-select">
      <div class="role-btn active" id="btn-acheteur" onclick="setRole('acheteur')">
        <span class="role-icon">📖</span>
        <span class="role-label">Acheteur</span>
      </div>
      <div class="role-btn" id="btn-auteur" onclick="setRole('auteur')">
        <span class="role-icon">✍️</span>
        <span class="role-label">Auteur</span>
      </div>
    </div>

    <div class="error-msg" id="error-msg"></div>
    <div class="success-msg" id="success-msg"></div>

    <div class="form-row">
      <div class="form-group">
        <label>Prénom</label>
        <input type="text" id="prenom" placeholder="Votre prénom">
      </div>
      <div class="form-group">
        <label>Nom</label>
        <input type="text" id="nom" placeholder="Votre nom">
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="votre@email.com">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="Min. 8 caractères">
    </div>
    <div class="form-group">
      <label>Pays</label>
      <input type="text" id="pays" placeholder="France, Côte d'Ivoire, RDC...">
    </div>
    <button class="btn-submit" onclick="register()">Créer mon compte</button>
    <div class="auth-footer">
      Déjà inscrit ? <a href="login.html">Se connecter</a>
      &nbsp;|&nbsp; <a href="../index.html">Retour</a>
    </div>
  </div>
</div>
<script>
const API_URL = 'https://phg-akhenaton-ia.up.railway.app';
let selectedRole = 'acheteur';

// Pré-sélection via URL
const params = new URLSearchParams(window.location.search);
if (params.get('role') === 'auteur') setRole('auteur');

function setRole(role) {
  selectedRole = role;
  document.getElementById('btn-acheteur').classList.toggle('active', role === 'acheteur');
  document.getElementById('btn-auteur').classList.toggle('active', role === 'auteur');
}

async function register() {
  const err = document.getElementById('error-msg');
  const ok = document.getElementById('success-msg');
  err.style.display = 'none'; ok.style.display = 'none';
  const body = {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    nom: document.getElementById('nom').value,
    prenom: document.getElementById('prenom').value,
    role: selectedRole,
    pays: document.getElementById('pays').value
  };
  if (!body.email || !body.password || !body.nom) {
    err.textContent = 'Remplissez tous les champs obligatoires'; err.style.display = 'block'; return;
  }
  try {
    const res = await fetch(API_URL + '/auth/register', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.detail || 'Erreur inscription'; err.style.display = 'block'; return; }
    localStorage.setItem('token', data.access_token);
    localStorage.setItem('user', JSON.stringify(data.user));
    ok.textContent = 'Compte créé ! Redirection...'; ok.style.display = 'block';
    setTimeout(() => {
      window.location = selectedRole === 'auteur' ? 'dashboard-auteur.html' : '../index.html';
    }, 1500);
  } catch(e) { err.textContent = 'Serveur inaccessible'; err.style.display = 'block'; }
}
</script>
</body>
</html>
