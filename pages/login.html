<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — PHG AKHENATON IA</title>
<link rel="stylesheet" href="../css/style.css">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
.auth-page { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 2rem; }
.auth-card { background: #111; border: 1px solid rgba(212,168,50,0.3); border-radius: 16px; padding: 3rem; width: 100%; max-width: 440px; }
.auth-logo { text-align: center; margin-bottom: 2rem; }
.auth-logo .logo-eye { font-size: 2.5rem; color: #d4a832; }
.auth-card h2 { font-family: 'Cinzel', serif; text-align: center; color: #d4a832; margin-bottom: 0.5rem; }
.auth-card p { text-align: center; color: #888; font-size: 0.9rem; margin-bottom: 2rem; }
.form-group { margin-bottom: 1.25rem; }
.form-group label { display: block; font-size: 0.85rem; color: #ccc; margin-bottom: 0.4rem; }
.form-group input { width: 100%; background: #1a1a1a; border: 1px solid rgba(212,168,50,0.2); border-radius: 8px; padding: 0.75rem 1rem; color: #fff; font-family: 'Inter', sans-serif; font-size: 0.95rem; outline: none; transition: border-color 0.3s; }
.form-group input:focus { border-color: #d4a832; }
.btn-submit { width: 100%; background: #d4a832; color: #0a0a0a; border: none; border-radius: 8px; padding: 0.9rem; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 0.5rem; transition: background 0.3s; }
.btn-submit:hover { background: #f0c84a; }
.auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.88rem; color: #888; }
.auth-footer a { color: #d4a832; text-decoration: none; }
.error-msg { background: rgba(139,26,26,0.2); border: 1px solid rgba(139,26,26,0.4); border-radius: 8px; padding: 0.75rem; color: #ff6b6b; font-size: 0.85rem; margin-bottom: 1rem; display: none; }
</style>
</head>
<body>
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-eye">𓂀</div>
    </div>
    <h2>Connexion</h2>
    <p>Accédez à votre espace PHG AKHENATON IA</p>
    <div class="error-msg" id="error-msg"></div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" id="email" placeholder="votre@email.com">
    </div>
    <div class="form-group">
      <label>Mot de passe</label>
      <input type="password" id="password" placeholder="••••••••">
    </div>
    <button class="btn-submit" onclick="login()">Se connecter</button>
    <div class="auth-footer">
      Pas encore de compte ? <a href="register.html">S'inscrire</a>
      &nbsp;|&nbsp; <a href="../index.html">Retour</a>
    </div>
  </div>
</div>
<script>
const API_URL = 'https://phg-akhenaton-ia.up.railway.app';
async function login() {
  const email = document.getElementById('email').value;
  const password = document.getElementById('password').value;
  const err = document.getElementById('error-msg');
  err.style.display = 'none';
  const form = new URLSearchParams();
  form.append('username', email);
  form.append('password', password);
  try {
    const res = await fetch(API_URL + '/auth/login', { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) { err.textContent = data.detail || 'Erreur de connexion'; err.style.display = 'block'; return; }
    localStorage.setItem('token', data.access_token);
    localStorage.setItem('user', JSON.stringify(data.user));
    window.location = data.user.role === 'auteur' ? 'dashboard-auteur.html' : '../index.html';
  } catch(e) { err.textContent = 'Serveur inaccessible'; err.style.display = 'block'; }
}
document.addEventListener('keydown', function(e) { if(e.key === 'Enter') login(); });
</script>
</body>
</html>
